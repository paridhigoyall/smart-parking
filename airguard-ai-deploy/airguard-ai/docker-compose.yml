name: airguard-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airguard_password}
      POSTGRES_DB: ${POSTGRES_DB:-airguard_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Unlike the old Next.js frontend, Streamlit reads this at container
      # RUNTIME (not baked in at build time) — safe to override here.
      API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  pgdata:
