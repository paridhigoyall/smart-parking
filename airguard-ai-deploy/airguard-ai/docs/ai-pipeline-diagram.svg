<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6478"/>
    </marker>
    <marker id="arrowSafe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2DD4A7"/>
    </marker>
    <marker id="arrowAmber2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5A623"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#0A0F1C"/>
  <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#141D30" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="620" fill="url(#grid2)" opacity="0.5"/>

  <text x="600" y="42" text-anchor="middle" fill="#E8EDF6" font-size="26" font-weight="700">Risk Detection Pipeline — Rule Engine + ML, Side by Side</text>
  <text x="600" y="66" text-anchor="middle" fill="#8B96AB" font-size="13">Two independent classifiers score every reading; agreement is itself a trust signal</text>

  <!-- Input -->
  <rect x="470" y="95" width="260" height="64" rx="10" fill="#101828" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="600" y="122" text-anchor="middle" fill="#E8EDF6" font-size="14" font-weight="600">Multi-gas Sensor Reading</text>
  <text x="600" y="141" text-anchor="middle" fill="#8B96AB" font-size="10">CO, CO2, NO2, SO2, NH3, H2S, CH4, LPG, smoke, PM2.5, PM10</text>

  <!-- Split arrows -->
  <path d="M 540 159 C 460 190, 340 200, 300 225" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M 660 159 C 740 190, 860 200, 900 225" fill="none" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Rule engine box -->
  <rect x="120" y="228" width="360" height="150" rx="10" fill="#101828" stroke="#2DD4A7" stroke-width="2"/>
  <text x="300" y="256" text-anchor="middle" fill="#E8EDF6" font-size="15" font-weight="700">Rule-Based Risk Engine</text>
  <text x="300" y="276" text-anchor="middle" fill="#8B96AB" font-size="11">app/services/risk_engine.py</text>
  <text x="150" y="300" fill="#8B96AB" font-size="10.5">• Per-gas ratio vs. regulatory threshold</text>
  <text x="150" y="318" fill="#8B96AB" font-size="10.5">• Toxicity-weighted blend across gases</text>
  <text x="150" y="336" fill="#8B96AB" font-size="10.5">• Single-gas breach overrides the average</text>
  <text x="150" y="354" fill="#8B96AB" font-size="10.5">• 100% explainable — every score traces</text>
  <text x="165" y="369" fill="#8B96AB" font-size="10.5">to a specific gas value</text>

  <!-- ML engine box -->
  <rect x="720" y="228" width="360" height="150" rx="10" fill="#101828" stroke="#F5A623" stroke-width="2"/>
  <text x="900" y="256" text-anchor="middle" fill="#E8EDF6" font-size="15" font-weight="700">Trained ML Classifier</text>
  <text x="900" y="276" text-anchor="middle" fill="#8B96AB" font-size="11">app/ml/train_risk_classifier.py</text>
  <text x="750" y="300" fill="#8B96AB" font-size="10.5">• RandomForestClassifier, 200 trees</text>
  <text x="750" y="318" fill="#8B96AB" font-size="10.5">• Trained on 12,000 synthetic labeled readings</text>
  <text x="750" y="336" fill="#8B96AB" font-size="10.5">• 92.6% held-out test accuracy</text>
  <text x="750" y="354" fill="#8B96AB" font-size="10.5">• Captures non-linear multi-gas interactions</text>
  <text x="765" y="369" fill="#8B96AB" font-size="10.5">a linear blend can under-weight</text>

  <!-- Merge arrows -->
  <path d="M 300 378 C 300 410, 480 430, 560 450" fill="none" stroke="#2DD4A7" stroke-width="1.5" marker-end="url(#arrowSafe)"/>
  <path d="M 900 378 C 900 410, 720 430, 640 450" fill="none" stroke="#F5A623" stroke-width="1.5" marker-end="url(#arrowAmber2)"/>

  <!-- Comparison box -->
  <rect x="400" y="453" width="400" height="70" rx="10" fill="#101828" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="600" y="480" text-anchor="middle" fill="#E8EDF6" font-size="14" font-weight="600">POST /ml/classify</text>
  <text x="600" y="500" text-anchor="middle" fill="#8B96AB" font-size="10.5">Returns both results + an agreement flag</text>
  <text x="600" y="514" text-anchor="middle" fill="#5B6478" font-size="9.5">Disagreement between the two = worth a second look</text>

  <line x1="600" y1="523" x2="600" y2="553" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Downstream -->
  <rect x="360" y="556" width="480" height="50" rx="10" fill="#101828" stroke="#F0453A" stroke-width="1.5"/>
  <text x="600" y="586" text-anchor="middle" fill="#E8EDF6" font-size="13" font-weight="600">Recommendation Engine → Alert → Notification Dispatch</text>
</svg>
