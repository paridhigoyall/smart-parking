<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6478"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5A623"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#0A0F1C"/>
  <rect width="1200" height="680" fill="url(#grid)" opacity="0.5"/>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#141D30" stroke-width="1"/>
  </pattern>

  <text x="600" y="42" text-anchor="middle" fill="#E8EDF6" font-size="26" font-weight="700">AirGuard AI — System Architecture</text>
  <text x="600" y="66" text-anchor="middle" fill="#8B96AB" font-size="13">AI-Powered Industrial Parking &amp; Environmental Safety Platform</text>

  <!-- Browser -->
  <rect x="470" y="95" width="260" height="60" rx="10" fill="#101828" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="600" y="122" text-anchor="middle" fill="#E8EDF6" font-size="15" font-weight="600">Browser</text>
  <text x="600" y="141" text-anchor="middle" fill="#8B96AB" font-size="11">Dashboard · Digital Twin</text>

  <line x1="600" y1="155" x2="600" y2="185" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Frontend -->
  <rect x="440" y="188" width="320" height="70" rx="10" fill="#101828" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="600" y="216" text-anchor="middle" fill="#E8EDF6" font-size="15" font-weight="600">Streamlit Frontend</text>
  <text x="600" y="236" text-anchor="middle" fill="#8B96AB" font-size="11">Python · Plotly · brown/green/yellow theme</text>
  <text x="600" y="251" text-anchor="middle" fill="#5B6478" font-size="10">:8501</text>

  <line x1="600" y1="258" x2="600" y2="288" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="278" fill="#5B6478" font-size="10">REST + JWT</text>

  <!-- Backend -->
  <rect x="380" y="291" width="440" height="90" rx="10" fill="#101828" stroke="#F5A623" stroke-width="2"/>
  <text x="600" y="318" text-anchor="middle" fill="#E8EDF6" font-size="15" font-weight="600">FastAPI Backend</text>
  <text x="600" y="337" text-anchor="middle" fill="#8B96AB" font-size="11">60+ REST endpoints · JWT + RBAC · Alembic migrations</text>
  <text x="600" y="354" text-anchor="middle" fill="#8B96AB" font-size="11">Risk / Recommendation / Forecasting / Route / Maintenance / Analytics / Vision / ML engines</text>
  <text x="600" y="371" text-anchor="middle" fill="#5B6478" font-size="10">:8000</text>

  <!-- Data layer row -->
  <line x1="480" y1="381" x2="480" y2="415" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="381" x2="600" y2="415" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="381" x2="880" y2="415" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="418" width="220" height="60" rx="10" fill="#101828" stroke="#2DD4A7" stroke-width="1.5"/>
  <text x="480" y="444" text-anchor="middle" fill="#E8EDF6" font-size="13" font-weight="600">PostgreSQL</text>
  <text x="480" y="462" text-anchor="middle" fill="#8B96AB" font-size="10">13 tables · 4 migrations</text>

  <rect x="600" y="418" width="180" height="60" rx="10" fill="#101828" stroke="#F0453A" stroke-width="1.5"/>
  <text x="690" y="444" text-anchor="middle" fill="#E8EDF6" font-size="13" font-weight="600">Redis</text>
  <text x="690" y="462" text-anchor="middle" fill="#8B96AB" font-size="10">Celery broker + cache</text>

  <rect x="790" y="418" width="220" height="60" rx="10" fill="#101828" stroke="#F0453A" stroke-width="1.5"/>
  <text x="900" y="444" text-anchor="middle" fill="#E8EDF6" font-size="13" font-weight="600">Celery Worker</text>
  <text x="900" y="462" text-anchor="middle" fill="#8B96AB" font-size="10">Async alert delivery</text>

  <line x1="900" y1="478" x2="900" y2="510" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="790" y="513" width="220" height="55" rx="10" fill="#101828" stroke="#1F2A3D" stroke-width="1.5"/>
  <text x="900" y="536" text-anchor="middle" fill="#E8EDF6" font-size="12" font-weight="600">Email · SMS · Push</text>
  <text x="900" y="553" text-anchor="middle" fill="#8B96AB" font-size="10">SMTP · Twilio REST · FCM v1</text>

  <!-- ML/AI models box -->
  <line x1="480" y1="478" x2="480" y2="510" stroke="#F5A623" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <rect x="290" y="513" width="380" height="90" rx="10" fill="#101828" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="537" text-anchor="middle" fill="#F5A623" font-size="13" font-weight="600">AI / ML Layer</text>
  <text x="480" y="558" text-anchor="middle" fill="#8B96AB" font-size="10">Rule-based Risk Engine (transparent, threshold-driven)</text>
  <text x="480" y="574" text-anchor="middle" fill="#8B96AB" font-size="10">RandomForest Classifier — 92.6% test accuracy (trained model)</text>
  <text x="480" y="590" text-anchor="middle" fill="#8B96AB" font-size="10">YOLOv8n object detection + classical smoke/fire CV heuristic</text>

  <!-- Sensors -->
  <line x1="380" y1="336" x2="230" y2="336" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="300" width="170" height="72" rx="10" fill="#101828" stroke="#1F2A3D" stroke-width="1.5"/>
  <text x="145" y="326" text-anchor="middle" fill="#E8EDF6" font-size="12" font-weight="600">Gas Sensors</text>
  <text x="145" y="344" text-anchor="middle" fill="#8B96AB" font-size="10">CO · CO2 · NO2 · SO2</text>
  <text x="145" y="359" text-anchor="middle" fill="#8B96AB" font-size="10">H2S · LPG · PM2.5 · PM10...</text>

  <!-- CCTV -->
  <line x1="720" y1="336" x2="880" y2="336" stroke="#5B6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="885" y="300" width="170" height="72" rx="10" fill="#101828" stroke="#1F2A3D" stroke-width="1.5"/>
  <text x="970" y="326" text-anchor="middle" fill="#E8EDF6" font-size="12" font-weight="600">CCTV Frames</text>
  <text x="970" y="344" text-anchor="middle" fill="#8B96AB" font-size="10">Vehicle / person detection</text>
  <text x="970" y="359" text-anchor="middle" fill="#8B96AB" font-size="10">Smoke / fire heuristic</text>

  <!-- Bottom legend -->
  <rect x="60" y="625" width="14" height="14" rx="3" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="82" y="636" fill="#8B96AB" font-size="11">App layer</text>
  <rect x="170" y="625" width="14" height="14" rx="3" fill="none" stroke="#F5A623" stroke-width="1.5"/>
  <text x="192" y="636" fill="#8B96AB" font-size="11">AI / API core</text>
  <rect x="300" y="625" width="14" height="14" rx="3" fill="none" stroke="#2DD4A7" stroke-width="1.5"/>
  <text x="322" y="636" fill="#8B96AB" font-size="11">Data store</text>
  <rect x="410" y="625" width="14" height="14" rx="3" fill="none" stroke="#F0453A" stroke-width="1.5"/>
  <text x="432" y="636" fill="#8B96AB" font-size="11">Async / external delivery</text>
</svg>
